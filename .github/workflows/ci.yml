name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest

      - name: Check types
        run: python -m mypy

      - name: Build and smoke-test installed wheel
        shell: bash
        run: |
          dist_dir="${RUNNER_TEMP}/banglasecure-dist"
          smoke_venv="${RUNNER_TEMP}/banglasecure-wheel-venv"
          python -m build --outdir "$dist_dir"

          wheel="$(find "$dist_dir" -maxdepth 1 -name '*.whl' -print -quit)"
          sdist="$(find "$dist_dir" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$wheel"
          test -n "$sdist"

          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install "$wheel"

          cd "$RUNNER_TEMP"
          "$smoke_venv/bin/python" -I -c '
          import sys
          from pathlib import Path

          import banglasecure_baseline

          package_path = Path(banglasecure_baseline.__file__).resolve()
          venv_path = Path(sys.prefix).resolve()
          workspace_path = Path(sys.argv[1]).resolve()
          assert package_path.is_relative_to(venv_path), package_path
          assert not package_path.is_relative_to(workspace_path), package_path
          ' "$GITHUB_WORKSPACE"

          cli="$smoke_venv/bin/banglasecure"
          "$cli" --help
          "$cli" dependency-audit --help
          "$cli" secret-scan --help
          "$cli" web-check --help
          for scan_command in dependency-audit secret-scan web-check; do
            command_help="$("$cli" "$scan_command" --help)"
            [[ "$command_help" == *"--minimum-severity"* ]]
          done
          "$cli" version
